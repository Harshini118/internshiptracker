name: NextOffer internship scan
on:
  schedule:
    # 8 times a day, offset from high-traffic :00 boundaries; UTC.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nextoffer-job-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh internship feed
        run: python scan_jobs.py
      - name: Commit public job metadata only
        run: |
          git config user.name 'nextoffer-job-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public internship matches'
            git push
          fi
